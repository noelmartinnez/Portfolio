  <body>
    <div id="root"></div>
    <!-- Si la app no llega a montarse (p. ej. un error al cargar el JS en un
         navegador concreto), se muestra el motivo en lugar de una pantalla negra. -->
    <script>
      (function () {
        var first = null;
        window.addEventListener("error", function (e) {
          if (!first) first = e.message || (e.target && e.target.src) || "error";
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          if (!first) first = String((e.reason && e.reason.message) || e.reason);
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-content:center;gap:1rem;padding:2rem;text-align:center;color:#fff;font-family:sans-serif">' +
            '<p style="font-size:1.25rem;font-weight:700">Algo ha fallado al cargar la web.</p>' +
            '<button onclick="location.reload()" style="justify-self:center;padding:.6rem 1.4rem;border-radius:.5rem;background:#915eff;color:#fff;border:0">Recargar</button>' +
            '<code style="font-size:.75rem;color:#aaa6c3;word-break:break-word"></code></div>';
          root.querySelector("code").textContent = first || "La aplicación no se ha iniciado.";
        }, 8000);
      })();
    </script>
    
  </body>
