name: Build and Deploy to Hostinger Branch

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Clona el repositorio
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Configura Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 16

    # 3. Instala dependencias
    - name: Install dependencies
      run: npm install

    # 4. Construye el proyecto
    - name: Build the project
      run: npm run build

    # 5. Elimina los archivos en el servidor (FTP)
    - name: Delete files on Hostinger server (FTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 92.113.18.41
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/
        action: "delete"  # Elimina los archivos en /public_html/

    # 6. Publica la carpeta dist en la rama "hostinger"
    - name: Deploy dist to hostinger branch
      run: |
          # Configura Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Crea una rama temporal
          git checkout --orphan temp-branch

          # Añadir node_modules a .gitignore temporalmente para evitar que se suba
          echo "node_modules/" >> .gitignore
          
          # Limpia todo excepto dist
          git rm -rf . || true
          mv dist/* .
          rm -rf dist
          
          # Añade solo el contenido de dist
          git add .
          
          # Commit con el contenido de dist
          git commit -m "Deploy dist folder to hostinger branch"
          
          # Fuerza los cambios a la rama "hostinger"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" temp-branch:hostinger
          
          # Cambia a un estado desconectado para poder eliminar la rama temporal
          git checkout --detach
          
          # Limpia la rama temporal
          git branch -D temp-branch
